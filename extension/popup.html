<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chameleon</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="popup">

  <header class="popup__head">
    <span class="popup__brand">Chameleon 🦎</span>
    <span class="popup__version" id="status-pill">v1.0</span>
  </header>

  <div class="project-badge" id="project-badge" hidden title="This page declares a chameleon-project — your colour pick is saved per project (synced to your Google account)">
    <svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 1.5l2 4.5 4.5.6-3.3 3.1.8 4.6L8 12l-4 2.3.8-4.6L1.5 6.6 6 6z" fill="currentColor"/>
    </svg>
    <span>project · </span><span class="project-badge__name"></span>
  </div>

  <section class="popup__notice popup__notice--info" id="file-access-notice" hidden>
    <span class="popup__notice-dot" aria-hidden="true"></span>
    <span class="popup__notice-text">Local file access is off.</span>
    <a class="popup__notice-link" href="#" id="open-settings-btn">Enable →</a>
  </section>

  <section class="popup__notice" id="not-detected-notice" hidden>
    <span class="popup__notice-dot" aria-hidden="true"></span>
    <span class="popup__notice-text">Not detected on this page.</span>
    <a class="popup__notice-link" href="https://github.com/churin1116/html-chameleon#quick-start" target="_blank" rel="noopener">Add it →</a>
  </section>

  <section class="popup__section">
    <div class="popup__label">Theme</div>
    <div class="presets" id="presets">
      <button class="preset" data-mode="system">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #ffffff 50%, #0a0a0a 50%);"></span>
        <span class="preset__name">System</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="light">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #ffffff 50%, #2563eb 50%);"></span>
        <span class="preset__name">Light</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="dark">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #0a0a0a 50%, #60a5fa 50%);"></span>
        <span class="preset__name">Dark</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="sunset">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #fff7ed 50%, #ea580c 50%);"></span>
        <span class="preset__name">Sunset</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="forest">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #f0fdf4 50%, #15803d 50%);"></span>
        <span class="preset__name">Forest</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="midnight">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #030712 50%, #a78bfa 50%);"></span>
        <span class="preset__name">Midnight</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="ocean">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #f0f9ff 50%, #0284c7 50%);"></span>
        <span class="preset__name">Ocean</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="rose">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #fff1f2 50%, #e11d48 50%);"></span>
        <span class="preset__name">Rose</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="slate">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #f8fafc 50%, #475569 50%);"></span>
        <span class="preset__name">Slate</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="lavender">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #faf5ff 50%, #9333ea 50%);"></span>
        <span class="preset__name">Lavender</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="mint">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #f0fdfa 50%, #0d9488 50%);"></span>
        <span class="preset__name">Mint</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="claude">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #faf9f5 50%, #d97757 50%);"></span>
        <span class="preset__name">Claude</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="graphite">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #0b0c0d 50%, #14b8a6 50%);"></span>
        <span class="preset__name">Graphite</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-mode="nocturne">
        <span class="preset__swatch" style="background: linear-gradient(135deg, #0a0d12 50%, #54acbf 50%);"></span>
        <span class="preset__name">Nocturne</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- Custom palettes (populated from chrome.storage by popup.js) -->
    <div class="popup__custom-palettes" id="custom-palettes" hidden></div>

    <button class="popup__manage" id="manage-themes-btn" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      <span>Manage themes</span>
    </button>
    <button class="popup__manage" id="customize-palette-btn" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3a9 9 0 0 1 0 18c-1.7 0-2-1-1.5-1.7.6-.7 1-1.5.5-2.3-.5-.7-1.7-.4-2.3-.2C7.5 17.4 6 16 6 14.4c0-.9.7-1.6 1.7-1.6 1 0 1.6-.7 1.6-1.4 0-.9-1-1-1-2 0-1 1-1.7 2.2-1.7 1 0 1.5.5 2.5.5"/>
      </svg>
      <span>Customize palette</span>
    </button>
  </section>

  <section class="popup__section">
    <div class="popup__label">Style</div>
    <div class="presets" id="styles">
      <button class="preset" data-style="default">
        <span class="preset__aa" style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;">Aa</span>
        <span class="preset__name">Default</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-style="editorial">
        <span class="preset__aa" style="font-family: ui-serif, 'Charter', Georgia, 'Times New Roman', serif;">Aa</span>
        <span class="preset__name">Editorial</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="preset" data-style="mono">
        <span class="preset__aa" style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;">Aa</span>
        <span class="preset__name">Mono</span>
        <svg class="preset__check" width="11" height="11" viewBox="0 0 10 10"><path d="M2 5.2 L4 7.2 L8 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <section class="popup__section popup__footer">
    <a href="https://github.com/churin1116/html-chameleon" class="gh-icon-btn" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub repository">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </section>

</div>

<script src="popup.js"></script>
</body>
</html>
