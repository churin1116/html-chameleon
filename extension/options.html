<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="chameleon" content="v1">
<title>Chameleon — Manage themes</title>

<link rel="icon" type="image/png" href="icons/icon-128.png">
<link rel="stylesheet" href="https://churin1116.github.io/html-chameleon/theme/v1/theme.css">
<script src="https://churin1116.github.io/html-chameleon/theme/v1/theme.js"></script>

<style>
  body {
    line-height: 1.6;
    margin: 0;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 4rem 1.5rem;
  }
  h1 {
    font-size: 2.5rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
    text-align: center;
  }
  .lede {
    font-size: 1.05rem;
    margin: 0 0 2.5rem;
    text-align: center;
  }

  .theme-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .theme-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md, 10px);
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    text-align: left;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .theme-row:hover { border-color: var(--primary); }
  .theme-row[aria-pressed="true"] { border-color: var(--primary); }
  .theme-row__swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .theme-row__name {
    flex: 1;
    font-weight: 500;
    font-size: 1rem;
  }
  .theme-row__star {
    color: var(--text-subtle);
    transition: color 0.15s ease;
    flex-shrink: 0;
  }
  .theme-row[aria-pressed="true"] .theme-row__star {
    color: #facc15;
  }

  .counter {
    text-align: center;
    margin-top: 1.75rem;
    font-size: 0.9rem;
  }

  .footer {
    margin-top: 3rem;
    text-align: center;
    font-size: 0.85rem;
  }
  .footer a {
    color: var(--text-subtle);
    text-decoration: none;
  }
  .footer a:hover { color: var(--primary); }

  /* Shake animation when user tries to remove the last favorite. */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .theme-row.--shake { animation: shake 0.25s ease; }
</style>
</head>
<body class="bg-canvas">

<div class="wrap">
  <h1 class="text-base">Manage themes 🦎</h1>
  <p class="lede text-muted">
    Toggle which color themes appear in your Chameleon picker.
    Your active theme stays applied even if you remove it from favorites.
  </p>

  <div class="theme-list" id="theme-list" role="list"></div>

  <p class="counter text-subtle" id="counter" aria-live="polite">— of — favorited</p>

  <div class="footer">
    <a href="https://github.com/churin1116/html-chameleon" target="_blank" rel="noopener">github.com/churin1116/html-chameleon</a>
  </div>
</div>

<script src="options.js"></script>
</body>
</html>
